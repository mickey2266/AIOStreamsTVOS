# XcodeGen spec: `xcodegen generate` writes AIOStreamsTV.xcodeproj from this file.
name: AIOStreamsTV
options:
  bundleIdPrefix: io.github.aiostreams
  deploymentTarget:
    # AetherEngine's floor.
    tvOS: "18.0"
  createIntermediateGroups: true
packages:
  # AetherEngine, pinned (see its Package.swift).
  AetherHost:
    path: Packages/AetherHost
  # libass 0.17.3 with FreeType, HarfBuzz, FriBidi and CoreText, prebuilt: ASS/SSA subtitles as mpv drew them.
  SwiftLibass:
    url: https://github.com/mihai8804858/swift-libass
    exactVersion: 1.4.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set this to your Apple Developer team ID, or pick the team in Xcode.
    DEVELOPMENT_TEAM: ""
    # Shared by the app and its Top Shelf extension, which have to match.
    MARKETING_VERSION: "1.1.2"
    # A local build's. CI builds give the workflow's run number instead, so each is newer than the last.
    CURRENT_PROJECT_VERSION: "1"
targets:
  AIOStreamsTV:
    type: application
    platform: tvOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - AIOStreamsTV.entitlements
      # What the app and the Top Shelf extension both read.
      - path: Shared
      # The web app's standalone build, from scripts/fetch-web.sh. Kept outside App:
      # macOS ignores case in names, so App/web would be the same folder as App/Web.
      - path: WebBuild
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: AIOStreams
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreams.tvos
        INFOPLIST_FILE: App/Info.plist
        # The App Group the Top Shelf extension reads Continue Watching and Next Up from.
        CODE_SIGN_ENTITLEMENTS: App/AIOStreamsTV.entitlements
        # The home screen icon and Top Shelf image, from App/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        # The WKWebView wrapper is Objective-C, as WebKit is only reached through the runtime.
        SWIFT_OBJC_BRIDGING_HEADER: App/AIOStreamsTV-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        # WebKit is loaded at runtime; nothing links against it.
        GCC_WARN_UNDECLARED_SELECTOR: NO
    dependencies:
      # Continue Watching and Next Up on the home screen, embedded in PlugIns.
      - target: AIOStreamsTopShelf
        embed: true
      - sdk: TVServices.framework
      # The player. Its FFmpeg comes as dynamic frameworks, which Xcode embeds.
      - package: AetherHost
      - package: SwiftLibass
      - sdk: MediaPlayer.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CoreMedia.framework
      - sdk: ImageIO.framework

  # The Top Shelf: Continue Watching and Next Up over the app's icon, from the list the app saves.
  AIOStreamsTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - path: TopShelf
        excludes:
          - Info.plist
          - TopShelf.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: AIOStreamsTopShelf
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aiostreams.tvos.topshelf
        INFOPLIST_FILE: TopShelf/Info.plist
        CODE_SIGN_ENTITLEMENTS: TopShelf/TopShelf.entitlements
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        # Linked with -e _NSExtensionMain: on Xcode's own entry point, -e _TVExtensionMain, the
        # extension exits with status 3 on tvOS 27.2 as tvOS starts it, before the content
        # provider loads, so the Top Shelf shows the static image, not Continue Watching and
        # Next Up. With this one (22afb4c) it shows them, but an update sent while the app sat
        # in the top row failed with "Connection refused (os error 61)", and only then. Every
        # build had CFBundleVersion 1 then; CI now gives each its run number, to see whether an
        # update that is a newer build installs. If it still fails there, take this line out
        # for updates that install wherever the app sits, and the static image.
        OTHER_LDFLAGS: "-e _NSExtensionMain"
    dependencies:
      - sdk: TVServices.framework
