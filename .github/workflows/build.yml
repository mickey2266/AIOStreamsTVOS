# Builds the app for Apple TV hardware, unsigned, and packs it as an .ipa.
# Every run attaches it as an artifact; a push to main, or a run started by
# hand on any branch, also replaces the rolling "nightly" release, and a v* tag
# publishes a release of its own.
# The .ipa has to be signed with your own Apple ID before an Apple TV installs it.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      aiostreams_ref:
        description: AIOStreams branch or tag to take the web app from
        default: main

permissions:
  contents: write

jobs:
  build:
    # AetherEngine supports Xcode 27 (Swift 6.4) only; GitHub's xcode-27 image is the one its own CI uses.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the web app
        env:
          AIOSTREAMS_REF: ${{ inputs.aiostreams_ref || 'main' }}
        run: |
          corepack enable
          bash scripts/fetch-web.sh

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # AetherEngine's and libass's packages (FFmpegBuild's frameworks are the bulk), kept between runs.
      - uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('Packages/AetherHost/Package.swift', 'project.yml') }}

      - name: Build for Apple TV
        run: |
          xcodebuild build \
            -project AIOStreamsTV.xcodeproj \
            -scheme AIOStreamsTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Pack the .ipa
        run: |
          app="build/Build/Products/Release-appletvos/AIOStreams.app"
          test -d "$app" || { echo "No app at $app"; ls -R build/Build/Products; exit 1; }
          shelf="$app/PlugIns/AIOStreamsTopShelf.appex"
          test -d "$shelf" || { echo "No Top Shelf extension at $shelf"; exit 1; }
          # AetherEngine's FFmpeg is dynamic frameworks in the app; without them nothing plays.
          ls "$app/Frameworks" | grep -q '^AetherLibavcodec.framework$' \
            || { echo "No AetherLibavcodec.framework in $app/Frameworks"; ls -la "$app/Frameworks" || true; exit 1; }
          # An ad-hoc signature carrying the App Group the app and its Top Shelf share,
          # which sideloading tools read when they re-sign. Inside out: the frameworks
          # and the extension first, as a bundle can't be signed around unsigned code.
          for framework in "$app"/Frameworks/*; do
            codesign --force --sign - --timestamp=none "$framework"
          done
          # The extension and the app as NuvioTVOS's build-ipa.sh signs them, whose Top Shelf
          # runs on Xcode's own entry point: each bundle's executable alone, with only the App
          # Group, rather than the whole bundle.
          for bundle in "$shelf" "$app"; do
            executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Info.plist")
            entitlements=App/AIOStreamsTV.entitlements
            [ "$bundle" = "$shelf" ] && entitlements=TopShelf/TopShelf.entitlements
            codesign --force --sign - --timestamp=none --entitlements "$entitlements" "$bundle/$executable"
            codesign -d --entitlements - "$bundle/$executable"
          done
          rm -rf Payload AIOStreams.ipa
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry AIOStreams.ipa Payload
          ls -lh AIOStreams.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AIOStreams-tvOS-ipa
          path: AIOStreams.ipa
          if-no-files-found: error

      # A push to main, or any run started by hand, on whichever branch it was started on (and
      # whichever AIOStreams ref it built). A tag run started by hand publishes its tagged release
      # below instead.
      - name: Publish the nightly release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
        env:
          GH_TOKEN: ${{ github.token }}
          AIOSTREAMS_REF: ${{ inputs.aiostreams_ref || 'main' }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly AIOStreams.ipa \
            --title "Nightly" \
            --notes "Unsigned build of ${GITHUB_SHA::8} from ${GITHUB_REF_NAME}, with the web app from AIOStreams ${AIOSTREAMS_REF}. Sign it with your own Apple ID to install." \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" AIOStreams.ipa \
            --title "$GITHUB_REF_NAME" \
            --notes "Unsigned build. Sign it with your own Apple ID to install, or add the AltStore-format source (https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/altstore/source.json) to an Apple TV sideloader that reads it." \
            --verify-tag

      # The AltStore-format source, which SideStore and the Apple TV sideloaders read too, gets the
      # release's version, size and link, committed to main. A push made with the workflow's own
      # token starts no other run, so this doesn't rebuild the nightly.
      - name: Add the release to the AltStore source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --depth 1 origin main
          git checkout -B main origin/main
          python3 scripts/update-source.py "$GITHUB_REF_NAME" AIOStreams.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          git diff --cached --quiet || git commit -m "AltStore source: $GITHUB_REF_NAME"
          git push origin main
